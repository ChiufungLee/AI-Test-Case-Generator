<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建测试任务 - AI智能测试平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/workflow.css">
    <link rel="stylesheet" href="/static/css/nav.css">
</head>
<body>
    {% set active_nav = 'workflow' %}
    <div class="app-container">
        {% include "partials/sidebar.html" %}

        <main class="main-content form-page">
            <header class="page-header">
                <div class="page-header-main">
                    <h1 class="page-title">新建工作流任务</h1>
                    <p class="page-subtitle">粘贴需求原文或上传需求文档，创建后自动开始需求分析</p>
                </div>
                <a class="back-btn" href="/workflows" data-tip="返回任务列表"><i class="fas fa-arrow-left"></i> 返回列表</a>
            </header>

            <div class="form-container">
                <section class="panel">
                    <h2 class="panel-title">任务信息</h2>
                    <input type="text" id="workflowName" class="wf-input" placeholder="任务名称（可选）" aria-label="任务名称">
                    <textarea id="workflowRequirement" class="wf-textarea" rows="12"
                        placeholder="粘贴需求原文，或上传需求文档自动解析，例如：新增手机号验证码登录功能，支持验证码登录，连续5次验证码错误后锁定30分钟。"
                        aria-label="需求原文"></textarea>
                    <div class="upload-row">
                        <button type="button" id="requirementUploadBtn" class="btn small">📄 上传需求文档</button>
                        <span class="upload-types">PDF / Word / TXT / MD</span>
                    </div>
                    <div id="requirementFileBar" class="requirement-file-bar" hidden></div>
                    <p id="requirementUploadStatus" class="upload-status" role="status" hidden></p>
                    <input type="file" id="requirementFileInput" accept=".pdf,.docx,.txt,.md" hidden>
                    <select id="workflowKb" class="wf-input" aria-label="选择知识库">
                        <option value="">不使用知识库</option>
                    </select>
                    <div class="btn-row">
                        <button id="createWorkflowBtn" class="btn primary">创建并开始</button>
                        <a class="btn" href="/workflows">取消</a>
                    </div>
                </section>
            </div>

            <footer class="footer-note">
                <p>© <span class="js-nav-year"></span> AI智能测试系统</p>
            </footer>
        </main>
    </div>

    <script src="/static/js/nav.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/workflow_new.js"></script>
</body>
</html>
